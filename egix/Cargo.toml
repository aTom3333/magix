[package]
name = "egix_module"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Emacs dynamic module using gitoxide to accelerate Magit operations"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]
name = "egix_module"

[dependencies]
emacs = "0.19"
gix = "0.83"
anyhow = "1.0"
thiserror = "1.0"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tracing-flame = { version = "0.2", optional = true }

[features]
# Compile-in flamegraph trace instrumentation. Off by default (zero overhead);
# the elisp build enables it when trace collection is requested.
trace = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-flame"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
